name: Notebooks

# Runs the five notebooks from top to bottom with the pinned requirements.txt.
# The DataCo dataset needs a Kaggle login, so CI cannot download it: the notebooks
# run on a synthetic file with the same columns (tests/make_sample_dataco.py).
# This proves the code runs end to end; the numbers in the README come from the
# real dataset. Runs when a notebook, src/ or the requirements change, and monthly.
on:
  push:
    paths:
      - "notebooks/**"
      - "src/**"
      - "requirements.txt"
      - "tests/make_sample_dataco.py"
      - ".github/workflows/notebooks.yml"
  schedule:
    - cron: "41 6 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # only used to keep the monthly schedule enabled (see last step)

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Write the synthetic DataCo-shaped dataset
        run: python tests/make_sample_dataco.py

      - name: Execute every notebook
        run: |
          mkdir -p executed
          for nb in notebooks/0*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=900 --ExecutePreprocessor.kernel_name=python3 \
              --output-dir executed "$nb"
            echo "::endgroup::"
          done

      - name: Upload the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed/

      - name: Keep the monthly schedule enabled
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notebooks.yml/enable"
